<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hart Aanmeldingen</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: één smal Outlook-taakpaneel (max 420px), gecentreerd; tabs bovenaan, lijsten als kaarten */
:root{
  --bg:#eef0f4; --pane:#ffffff; --ink:#1d2433; --muted:#5d6678; --line:#dde1ea;
  --accent:#b23a5b; --accent-soft:#f8e6ec; --sun:#9a6a12; --sun-soft:#fbf1dc;
  --ok:#2f7a55; --ok-soft:#e2f2e9; --chip:#eef1f7; --late:#c2410c; --late-soft:#fde8dd;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --pane:#1b202a; --ink:#e7eaf1; --muted:#9aa3b5; --line:#2c3340;
  --accent:#ec7c9a; --accent-soft:#3a2129; --sun:#e2b45c; --sun-soft:#352a14;
  --ok:#6cc697; --ok-soft:#173326; --chip:#252b37; --late:#f59a6b; --late-soft:#3a2216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --pane:#1b202a; --ink:#e7eaf1; --muted:#9aa3b5; --line:#2c3340;
  --accent:#ec7c9a; --accent-soft:#3a2129; --sun:#e2b45c; --sun-soft:#352a14;
  --ok:#6cc697; --ok-soft:#173326; --chip:#252b37; --late:#f59a6b; --late-soft:#3a2216; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.note{max-width:420px;margin:0 auto 10px;color:var(--muted);font-size:12.5px}
.pane{max-width:420px;margin:0 auto;background:var(--pane);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;min-height:680px}
header{padding:14px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
select,input{font:inherit;color:var(--ink);background:var(--pane);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.who select{padding:3px 6px;font-size:12px}
nav{display:flex;gap:4px;margin-top:12px}
nav button{flex:1;font:inherit;font-weight:700;font-size:13px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 4px 9px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;margin-left:4px}
main{padding:14px 16px 20px}
section{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.btn{font:inherit;font-weight:700;border-radius:7px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--pane);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,nav button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-family:var(--f-display);font-size:16px}
.drop small{color:var(--muted)}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .fl{font-size:12.5px;font-weight:700}
.parsed{font-size:12px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:6px 9px}
.via{display:flex;gap:6px;flex-wrap:wrap}
.via label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer}
.via label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.via input{accent-color:var(--accent);margin:0}
.hint{font-size:12px;color:var(--muted)}
.therapists{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.therapists label{border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative}
.therapists input{position:absolute;opacity:0}
.therapists label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.therapists label:has(input:focus-visible){outline:2px solid var(--accent)}
.therapists b{font-size:14px}.therapists small{color:var(--muted);font-size:12px;line-height:1.35}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--accent)}
.privacy{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--pane);color:var(--muted);border-radius:20px;padding:4px 10px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--pane);border-color:var(--ink)}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.capcard{border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;min-width:0}
.capcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.capcard b.n{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.capcard b.n small{font-size:13px;color:var(--muted);font-weight:500}
.meter{display:flex;gap:2px}
.meter i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.meter i.t{background:var(--accent)}
.meter i.f{background:var(--sun)}
.capcard .meta b{color:var(--ink)}
.capcard .max{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.capcard .max input{width:52px;padding:2px 5px;font-size:12px}
.free{font-size:12.5px;font-weight:700}
.free.now{color:var(--ok)}
.phases{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.phases b{color:var(--ink);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--pane);text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:15px}
.id{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted)}
.bar{display:flex;gap:2px}
.bar i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.bar i.d{background:var(--ok)}
.next{font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.s{background:var(--sun-soft);color:var(--sun)}
.chip.b{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.pas{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.pasrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.pasrow:has(input:checked){border-style:dashed;border-color:var(--muted);background:var(--chip)}
.pasrow input{margin-top:3px;width:17px;height:17px;accent-color:var(--muted);flex:none}
.pasrow span{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.pasrow small{color:var(--muted);font-size:12px}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.today{background:var(--sun-soft);color:var(--sun)}
.todo{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0}
.todo:last-child{border-bottom:0}
.todo input{margin-top:3px;width:17px;height:17px;accent-color:var(--ok);flex:none}
.todo .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.todo .t b{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.todo button{font:inherit;font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.group{margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:13px}
.sheet{position:absolute;inset:0;background:var(--pane);display:flex;flex-direction:column;z-index:5}
.sheet-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-head h2{font-family:var(--f-display);font-size:18px;margin:0;flex:1}
.sheet-body{padding:14px 16px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.phase h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 2px}
.step{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;flex-wrap:wrap}
.step input[type=checkbox]{width:17px;height:17px;accent-color:var(--ok);flex:none}
.step label{flex:1;min-width:0}
.step.done label{color:var(--muted)}
.step .when{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.na{opacity:.5}
.step.na label{text-decoration:line-through}
.dlrow{flex-basis:100%;display:flex;align-items:center;gap:6px;padding-left:26px;font-size:12px;color:var(--muted)}
.dlrow input{padding:2px 6px;font-size:12px}
.doc{display:flex;flex-direction:column;gap:6px}
.doc .thumbs{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--chip)}
.doc .thumbs img{width:100%;display:block;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.15);background:#fff;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.doc .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc .head button{font:inherit;font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.viewer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.viewer .vh{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--pane)}
.viewer .vh b{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vb{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.viewer img{display:block;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);user-select:none;-webkit-user-drag:none}
.demo-banner{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 input,.grid2 select{width:100%;min-width:0}
.link{background:var(--chip);border-radius:8px;padding:9px 11px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--pane);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* taakpaneel in Outlook: volle breedte, geen kader */
body{padding-block:0 24px}
.pane{max-width:none;border:0;border-radius:0;min-height:100vh}
.note{max-width:none;margin:0;padding:6px 16px;background:var(--sun-soft);color:var(--sun);font-size:11.5px;font-weight:700}
.mailctx{font-size:12px;color:var(--muted);background:var(--chip);border-radius:7px;padding:7px 10px}
.mailctx b{color:var(--ink)}
.pdfs{display:flex;flex-direction:column;gap:6px}
</style>
<style>
.setup{display:flex;flex-direction:column;gap:12px}
.setup h2{font-family:var(--f-display);font-size:17px;margin:0}
.setup p{margin:0;color:var(--muted);font-size:13px}
.setup input{width:100%}
.err{background:var(--late-soft);color:var(--late);border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.err code{font-size:11px;word-break:break-all;color:var(--ink);opacity:.75}
.loading{color:var(--muted);text-align:center;padding:40px 8px;font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.topbar button{font:inherit;font-size:11.5px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.fwd{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.fwd label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.fwd input[type=radio],.fwd input[type=checkbox]{margin-top:3px;accent-color:var(--accent)}
.fwd input[type=email]{width:100%;font-size:12.5px}
.busy{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<p class="note" id="note">Gekoppeld aan Excel · wijzigingen gaan direct naar het bestand</p>
<div class="pane" id="pane">
  <header>
    <div class="brand">
      <h1>Hart <span>Aanmeldingen</span></h1>
      <div class="who"><label for="me">Ik ben</label><select id="me"></select></div>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="nieuw" id="tab-nieuw">Nieuw</button>
      <button role="tab" data-tab="caseload" id="tab-caseload">Caseload</button>
      <button role="tab" data-tab="todo" id="tab-todo">To do's<span class="badge" id="todoCount"></span></button>
    </nav>
  </header>
  <main id="main"><p class="loading">Bezig met laden…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= instellingen ================= */
const CLIENT_ID='53cfd755-3237-4075-81cb-a0887cc7bb69';
const TENANT_ID='e4fa15f0-caab-49a0-9227-1c458d5c210a';
const SCOPES=['Files.ReadWrite.All','Mail.ReadWrite','Mail.Send'];
const MSAL_URLS=['https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/+esm','https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/+esm'];
const PDFJS=[['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
             ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js']];
const GRAPH='https://graph.microsoft.com/v1.0';

const FOLDER='Aanmeldingen verwerkt';
const COL={naam:'Voornaam',beh:'Behandelaar',datum:'Datum aanmelding',intake:'Datum intake',ses:'Aantal behandelingen',start:'Startdatum traject',eind:'Verwachte einddatum',james:'Cliëntnr James',wg:'Via werkgever',ba:'Via bedrijfsarts',ov:'Via anders',dl:'Deadline volgende stap',mail:'Link aanmeldmail',pas:'Passief',pasd:'Passief sinds'};
const S_NAAR='Aanmelding naar behandelaar',S_INTAKE='Intake gepland',S_UPLOAD='Formulieren in James',S_AF='Afgerond';
const PHASES=['Aanmeldingsfase','Intakefase','Startfase','Behandelingsfase','Afrondingsfase'];

/* ================= testmodus ================= */
const DEMO_STEPS=[['Aanmelding naar behandelaar','Aanmelding doorsturen naar behandelaar',0,'S',2,'vorige',0],['Cliënt in James','Cliënt aanmaken in James',0,'B',3,'vorige',0],
 ['Toestemmingsformulier volledig','Toestemmingsformulier compleet laten invullen',0,'B',7,'vorige',0],['Formulieren in James','Aanmeld- en toestemmingsformulier uploaden in James',0,'B',3,'vorige',0],
 ['Intake gepland','Intake inplannen',1,'B',5,'vorige',0],['Bevestigingsmail intake verzonden','Bevestigingsmail intake verzenden',1,'B',1,'vorige',0],
 ['Behandelplan + doelen','Behandelplan en doelen opstellen',1,'B',7,'intake',0],['Intake in James','Intakeverslag uploaden in James',1,'B',3,'intake',0],
 ['Aantal behandelingen bepaald','Aantal behandelingen bepalen',1,'B',3,'intake',0],['Offerte verzonden','Offerte versturen',1,'S',3,'vorige',0],
 ['Offerte akkoord','Akkoord op offerte binnenhalen',1,'S',10,'vorige',0],['Bedrijfsarts ingelicht behandeldoel','Bedrijfsarts informeren over behandeldoel',2,'B',5,'vorige',1],
 ['1e behandeling gepland','Eerste behandeling inplannen',2,'B',7,'vorige',0],['Laatste behandeling geweest','Laatste behandeling geven',3,'B',null,'eind',0],
 ['Bedrijfsarts ingelicht afronding','Bedrijfsarts informeren over afronding',4,'B',5,'vorige',1],['Afgerond','Traject afsluiten',4,'B',3,'vorige',0]]
 .map(([k,l,p,w,t,base,ba])=>({k,l,p,w,t,base,ba:!!ba}));
function demoLoad(){
  STEPS=DEMO_STEPS;T=['Susanne','Jasmijn'];cap={Susanne:6,Jasmijn:10};mail={Susanne:{addr:'',row:2},Jasmijn:{addr:'',row:3}};
  const mk=(row,naam,beh,ba,ago,n,eind)=>{const c={row,naam,beh,datum:add(today,-ago),intakeDatum:'',sessies:'',start:'',eind:eind!=null?add(today,eind):'',jamesNr:'',
    via:{wg:true,ba:!!ba,ov:false},dl:'',mailId:'',passief:false,pasDatum:'',done:{},doneDate:{}};
    let d=c.datum;STEPS.filter(s=>!s.ba||ba).slice(0,n).forEach(s=>{d=add(d,2);if(d>today)d=today;c.done[s.k]=true;c.doneDate[s.k]=d});

  state.clients=[mk(9001,'Noor','Jasmijn',1,2,0),mk(9002,'Bram','Susanne',0,6,1),mk(9003,'Fenna','Jasmijn',1,12,3),mk(9004,'Thijs','Jasmijn',1,18,6),
    mk(9005,'Lotte','Susanne',0,25,9),mk(9006,'Mees','Jasmijn',1,50,13,90),mk(9007,'Hanna','Jasmijn',1,90,13,40),mk(9008,'Ilse','Jasmijn',0,110,12,15)];
  state.emptyRows=[];state.rowCount=state.clients.length;}

/* ================= hulpjes ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=isoOf(new Date());
const add=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return isoOf(x)};
const fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'}):'–';
const toSerial=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5)};
const fromCell=v=>{if(v===''||v==null)return '';if(typeof v==='number'){const x=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return x.toISOString().slice(0,10)}
  const m=String(v).match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;const n=String(v).match(/^\d{4}-\d{2}-\d{2}/);return n?n[0]:''};
const truthy=v=>v===true||/^(ja|true|waar|x|1)$/i.test(String(v).trim());
const colLetter=n=>{let s='';n++;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s};
const letterIdx=L=>L.split('').reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)-1;
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,ms)}
const store={get(k){try{const r=Office.context.roamingSettings.get(k);if(r)return r}catch(e){}try{return JSON.parse(localStorage.getItem('hart-'+k))}catch(e){return null}},

let pca=null;
async function loadMsal(){let last;for(const u of MSAL_URLS){try{return await import(u)}catch(e){last=e}}throw new Error('Inlogbibliotheek kon niet laden ('+(last&&last.message)+')')}
async function token(){
  if(!pca){const msal=await loadMsal();
    const cfg={auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/'+TENANT_ID,supportsNestedAppAuth:true,redirectUri:location.origin+location.pathname.replace(/[^/]*$/,'')+'auth.html'},cache:{cacheLocation:'localStorage'}};
    pca=msal.createNestablePublicClientApplication?await msal.createNestablePublicClientApplication(cfg):new msal.PublicClientApplication(cfg);
    if(pca.initialize)await pca.initialize();}
  const acc=pca.getAllAccounts&&pca.getAllAccounts()[0];
  const req={scopes:SCOPES};if(acc)req.account=acc;
  try{return (await pca.acquireTokenSilent(req)).accessToken}
  catch(e){return (await pca.acquireTokenPopup({scopes:SCOPES})).accessToken}
}
async function g(path,opt={}){
  const t=await token();
  const r=await fetch(path.startsWith('http')?path:GRAPH+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===204)return null;
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error((j&&j.error&&j.error.message)||('Fout '+r.status));e.status=r.status;e.code=j&&j.error&&j.error.code;throw e}
  return j;
}

async function linkFile(url){

  const it=await g(`/shares/u!${b}/driveItem`);

}
async function loadAll(){

  STEPS=st.values.slice(1).filter(r=>r[si('Kolom in Caseload')]).sort((a,b)=>(+a[si('Volgorde')]||0)-(+b[si('Volgorde')]||0)).map(r=>{
    const base=String(r[si('Termijn telt vanaf')]||'').toLowerCase();
    return{k:String(r[si('Kolom in Caseload')]).trim(),l:String(r[si('Taak in de toepassing')]||r[si('Kolom in Caseload')]),p:Math.max(0,PHASES.indexOf(String(r[si('Fase')]).trim())),
      w:String(r[si('Wie')]).trim()==='Susanne'?'S':'B',t:r[si('Termijn (dagen)')]===''?null:+r[si('Termijn (dagen)')],
      base:base.includes('intake')?'intake':base.includes('eind')?'eind':'vorige',ba:truthy(r[si('Alleen bij bedrijfsarts')])}});

  // caseload
  const m=String(cs.address).match(/!\$?([A-Z]+)\$?(\d+)/);start={col:letterIdx(m[1]),row:+m[2]};
  H=cs.values[0].map(x=>String(x).trim());
  const missing=STEPS.filter(s=>!H.includes(s.k)).map(s=>s.k);
  if(missing.length)throw new Error('Deze stappen staan niet als kolom in Caseload: '+missing.join(', '));
  const ix=n=>H.indexOf(n);
  state.clients=cs.values.slice(1).map((r,i)=>{const v=n=>ix(n)<0?'':r[ix(n)];
    const c={row:start.row+1+i,naam:String(v(COL.naam)).trim(),beh:String(v(COL.beh)).trim(),datum:fromCell(v(COL.datum)),intakeDatum:fromCell(v(COL.intake)),

    c.passief=truthy(v(COL.pas));c.pasDatum=fromCell(v(COL.pasd));
    STEPS.forEach(s=>{c.done[s.k]=truthy(v(s.k));c.doneDate[s.k]=fromCell(v('Datum: '+s.k))});return c}).filter(c=>c.naam);
  state.rowCount=cs.values.length-1;
  state.emptyRows=cs.values.slice(1).map((r,i)=>({row:start.row+1+i,empty:!String(r[ix(COL.naam)]).trim()})).filter(x=>x.empty).map(x=>x.row);
}

const stepsFor=c=>STEPS.filter(s=>!s.ba||c.via.ba);
const nextStep=c=>stepsFor(c).find(s=>!c.done[s.k]);
const owner=(c,s)=>s.w==='S'?'Susanne':(c.beh||'?');
const isAf=c=>STEPS.some(s=>s.k===S_AF)?c.done[S_AF]:!nextStep(c);
const active=c=>!isAf(c);
const inBeh=c=>{const n=nextStep(c);return n&&n.p>=3};
const viaTxt=c=>VIA.filter(([k])=>c.via[k]).map(([,l])=>l).join(' + ')||'–';
function deadline(c,s){
  const n=nextStep(c);if(n&&n.k===s.k&&c.dl)return c.dl;
  if(s.base==='eind')return c.eind||null;
  if(s.t==null)return null;
  if(s.base==='intake'&&c.intakeDatum)return add(c.intakeDatum,s.t);
  const list=stepsFor(c),i=list.indexOf(s);
  for(let j=i-1;j>=0;j--){if(c.done[list[j].k])return c.doneDate[list[j].k]?add(c.doneDate[list[j].k],s.t):null}
  return c.datum?add(c.datum,s.t):null}
function dlChip(d){if(!d)return'';if(d<today)return`<span class="chip late">te laat · ${fmt(d)}</span>`;if(d===today)return`<span class="chip today">vandaag</span>`;return`<span class="chip">uiterlijk ${fmt(d)}</span>`}
function capacity(t,extra=0){
  const all=state.clients.filter(c=>c.beh===t&&active(c)),mine=all.filter(c=>!c.passief),pas=all.length-mine.length;
  const lopend=mine.length+extra,max=cap[t]||0,ends=mine.map(c=>c.eind).filter(Boolean).sort(),over=lopend-max;
  const free=over<0?{now:true,txt:`${-over} plek${-over===1?'':'ken'} vrij`}:{now:false,txt:ends[over]?`Plek vrij rond ${fmt(ends[over])}`:'Nog geen einddatum bekend'};
  return{lopend,beh:mine.filter(inBeh).length,max,free,pas}}
const byRow=r=>state.clients.find(c=>c.row===+r);

      <div class="field"><label for="s-beh">Behandelaar</label><select id="s-beh" data-f="${COL.beh}"><option value=""></option>${T.map(t=>`<option ${c.beh===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
      <div class="field"><label for="s-james">Cliëntnr. James</label><input id="s-james" data-f="${COL.james}" value="${esc(c.jamesNr)}"></div>
      <div class="field"><label for="s-ses">Aantal behandelingen</label><select id="s-ses" data-f="${COL.ses}" data-num="1"><option value="">Kies…</option>${[5,8,12].map(x=>`<option ${+c.sessies===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="s-intake">Datum intake</label><input id="s-intake" type="date" data-f="${COL.intake}" data-date="1" value="${c.intakeDatum}"></div>
      <div class="field"><label for="s-datum">Datum aanmelding</label><input id="s-datum" type="date" data-f="${COL.datum}" data-date="1" value="${c.datum}"></div>
      <div class="field"><label for="s-start">Startdatum traject</label><input id="s-start" type="date" data-f="${COL.start}" data-date="1" value="${c.start}"></div>
      <div class="field"><label for="s-eind">Verwachte einddatum</label><input id="s-eind" type="date" data-f="${COL.eind}" data-date="1" value="${c.eind}"></div>
    </div>
    <div class="field"><span class="fl">Aangemeld via</span>${viaBoxes(c,'s')}</div>
    ${!c.done[S_UPLOAD]&&c.mailId?`<div class="link"><span>Aanmeldformulier staat nog niet in James.</span><button class="btn" id="openMail">Open aanmelding</button></div>`:''}
    ${PHASES.map((p,i)=>{const ss=STEPS.filter(s=>s.p===i);if(!ss.length)return'';return `<div class="phase"><h3>${p}</h3>${ss.map(s=>{
      const na=s.ba&&!c.via.ba,dn=c.done[s.k],id='st-'+STEPS.indexOf(s);
      if(na)return `<div class="step na"><input type="checkbox" disabled aria-label="${esc(s.l)}"><label>${esc(s.l)}</label><span class="when">vervalt</span></div>`;
      return `<div class="step ${dn?'done':''}"><input type="checkbox" id="${id}" data-step="${esc(s.k)}" ${dn?'checked':''}><label for="${id}">${esc(s.l)}</label>
        ${dn?`<span class="when">✓ ${c.doneDate[s.k]?fmt(c.doneDate[s.k]):''}</span>`:`<span class="chip ${s.w==='S'?'s':'b'}">${esc(owner(c,s))}</span>`}
        ${s.k===S_INTAKE&&!dn?`<div class="dlrow"><label for="ip-${c.row}">Intake op</label><input type="date" id="ip-${c.row}" data-intake="1" value="${c.intakeDatum}"><span>vinkt de taak af</span></div>`:''}
        ${s.k===S_INTAKE&&dn&&c.intakeDatum?`<div class="dlrow">Intake op <b>${fmt(c.intakeDatum)}</b></div>`:''}
        ${!dn&&n&&n.k===s.k&&s.k!==S_INTAKE?`<div class="dlrow"><label for="dl-${c.row}">Deadline</label><input type="date" id="dl-${c.row}" data-dl="1" value="${deadline(c,s)||''}">${dlChip(deadline(c,s))}</div>`:''}
      </div>`}).join('')}</div>`}).join('')}
  </div>`;
  $('#pane').appendChild(el);
  el.querySelector('#close').onclick=()=>{state.open=null;el.remove();render()};
  const save=(obj,local)=>run(async()=>{await setCells(c.row,obj);local();},()=>openSheet(c.row));
  el.querySelectorAll('[data-step]').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.step,on=cb.checked;
    save({[k]:on,['Datum: '+k]:on?toSerial(today):'',[COL.dl]:''},()=>{c.done[k]=on;c.doneDate[k]=on?today:'';c.dl=''})});
  el.querySelectorAll('[data-intake]').forEach(i=>i.onchange=()=>{if(!i.value)return;const v=i.value;
    save({[COL.intake]:toSerial(v),[S_INTAKE]:true,['Datum: '+S_INTAKE]:toSerial(today),[COL.dl]:''},()=>{c.intakeDatum=v;c.done[S_INTAKE]=true;c.doneDate[S_INTAKE]=today;c.dl='';toast(`Intake ingepland op ${fmt(v)}.`)})});
  el.querySelectorAll('[data-dl]').forEach(i=>i.onchange=()=>{const v=i.value;save({[COL.dl]:v?toSerial(v):''},()=>{c.dl=v})});
  el.querySelector('#s-pas')?.addEventListener('change',e=>{const on=e.target.checked;
    run(async()=>{await ensureCol(COL.pas);const cc=byRow(c.row)||c;await setCells(cc.row,{[COL.pas]:on,[COL.pasd]:on?toSerial(today):''});cc.passief=on;cc.pasDatum=on?today:'';c.passief=on;toast(on?`${c.naam} staat op passief. Er komt een plek vrij bij ${c.beh}.`:`${c.naam} telt weer mee als lopend traject.`)},()=>openSheet(c.row))});
  el.querySelectorAll('.sheet-body [data-via]').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.via,on=cb.checked;save({[COL[k]]:on},()=>{c.via[k]=on})});
  const keyOf={[COL.beh]:'beh',[COL.james]:'jamesNr',[COL.ses]:'sessies',[COL.intake]:'intakeDatum',[COL.datum]:'datum',[COL.start]:'start',[COL.eind]:'eind'};
  el.querySelectorAll('.sheet-body [data-f]').forEach(i=>i.onchange=()=>{const f=i.dataset.f,v=i.value;
    save({[f]:i.dataset.date?toSerial(v):i.dataset.num?(v?+v:''):v},()=>{c[keyOf[f]]=i.dataset.num?(v?+v:''):v})});
  el.querySelector('#openMail')?.addEventListener('click',()=>{try{const id=MB().convertToEwsId(c.mailId,Office.MailboxEnums.RestVersion.v2_0);MB().displayMessageForm(id)}catch(e){toast('De aanmeldmail kon niet worden geopend. Hij staat in het postvak van degene die hem heeft toegewezen.')}});
}

let busy=false;
async function run(fn,after){if(busy)return;busy=true;$('#pane').classList.add('busy');
  try{await fn()}catch(e){console.error(e);toast('Opslaan in Excel lukte niet: '+e.message,6000);await refresh(false)}
  finally{busy=false;$('#pane').classList.remove('busy');if(after)after();render()}}
async function refresh(show=true){if(state.demo){render();return}state.err=null;if(show){state.loading=true;render()}
  try{await loadAll()}catch(e){state.err=e;
    if(e.status===404)e.hint='Het bestand of de tabel is niet gevonden. Staat de Excel nog op dezelfde plek, en heet de tabel nog tblCaseload?';
    else if(e.status===401||e.status===403||/consent|AADSTS/i.test(e.message))e.hint='Je hebt (nog) geen toegang. Log opnieuw in, of vraag de beheerder om toestemming te geven voor de app "Hart Aanmeldingen".';
    else if(e.status===423||/locked|EditModeCannotAcquireLock/i.test(e.message))e.hint='Het bestand is vergrendeld. Sluit de Excel in de bureaubladversie van Excel en probeer het opnieuw.'}
  state.loading=false;if(!state.filter||(!T.includes(state.filter)&&state.filter!=='Alle'))state.filter=T.includes('Jasmijn')?'Jasmijn':(T[0]||'Alle');render()}

let pdfLib=null;
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('kon '+u+' niet laden'));document.head.appendChild(s)})}
async function pdfRead(buf){
  if(!pdfLib){for(const [u,w] of PDFJS){try{await loadScript(u);window.pdfjsLib.GlobalWorkerOptions.workerSrc=w;pdfLib=window.pdfjsLib;break}catch(e){}}}
  if(!pdfLib)return {text:'',pages:[],total:0};
  const doc=await pdfLib.getDocument({data:buf}).promise;let out='';const pages=[];const MAXP=10;
  for(let p=1;p<=Math.min(doc.numPages,MAXP);p++){const pg=await doc.getPage(p);
    if(p<=6){const tc=await pg.getTextContent();
      let line='',lastY=null;tc.items.forEach(it=>{const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2){out+=line+'\n';line=''}line+=it.str+' ';lastY=y});out+=line+'\n'}
    const vp=pg.getViewport({scale:1.6});const cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;pages.push({src:cv.toDataURL('image/png'),w:cv.width,h:cv.height});cv.width=cv.height=0;}
  try{doc.destroy()}catch(e){}
  return {text:out,pages,total:doc.numPages}}
function parse(text){
  const r={naam:'',via:{wg:/werkgever/i.test(text),ba:/bedrijfsarts/i.test(text),ov:false},found:false};
  const N="([A-ZÀ-Þ][a-zà-ÿ'\\-]+)";
  const pats=[new RegExp('(?:roepnaam|voornaam)\\s*[:\\-]?\\s*'+N,'i'),
    new RegExp('naam\\s*(?:cli[eë]nt|werknemer|pati[eë]nt|medewerker)?\\s*[:\\-]\\s*(?:(?:mevr(?:ouw)?|dhr|de heer|mw|mr|ms)\\.?\\s+)?(?:[A-Z]\\.\\s*)*'+N,'i')];
  for(const p of pats){const m=text.match(p);if(m){r.naam=m[1];r.found=true;break}}
  if(!r.via.wg&&!r.via.ba)r.via.wg=true;return r}
async function startDraft(name,buf){
  let info={naam:'',via:{wg:true,ba:false,ov:false},found:false},rd={pages:[],total:0};
  if(buf){toast('Aanmelding wordt uitgelezen…',1500);try{rd=await pdfRead(buf);info=parse(rd.text)}catch(e){console.warn(e);toast('Deze pdf kon niet worden uitgelezen. Vul de gegevens zelf in.',4000)}}
  const it=curItem(),hasPdf=it&&(it.attachments||[]).some(a=>/\.pdf$/i.test(a.name||''));
  state.draft={file:name,pages:rd.pages,total:rd.total,naam:info.naam,found:info.found,via:info.via,datum:today,beh:'',fwd:hasPdf?'auto':'zivver',move:true,addr:''};render()}
function openViewer(start){const d=state.draft;if(!d||!d.pages||!d.pages.length)return;
  let z=1;const el=document.createElement('div');el.className='viewer';
  const draw=()=>{const w=Math.round(el.clientWidth*z-24);el.querySelector('.vb').innerHTML=d.pages.map((pg,i)=>`<img src="${pg.src}" alt="Pagina ${i+1}" draggable="false" style="width:${w}px">`).join('')};
  el.innerHTML=`<div class="vh"><button class="btn" id="vClose" aria-label="Sluiten">←</button><b>${esc(d.file||'Aanmelding')}</b><button class="btn" id="vOut" aria-label="Kleiner">−</button><button class="btn" id="vIn" aria-label="Groter">+</button></div><div class="vb"></div>`;
  document.body.appendChild(el);draw();
  const imgs=el.querySelectorAll('img');if(imgs[start])imgs[start].scrollIntoView();
  el.querySelector('#vClose').onclick=()=>el.remove();
  el.querySelector('#vIn').onclick=()=>{z=Math.min(3,z+.5);draw()};el.querySelector('#vOut').onclick=()=>{z=Math.max(1,z-.5);draw()};
  el.addEventListener('contextmenu',e=>e.preventDefault());}
function readDraft(){const d=state.draft;if(!d)return;
  const n=$('#f-naam');if(n)d.naam=n.value;const dt=$('#f-datum');if(dt)d.datum=dt.value;
  const r=document.querySelector('input[name=beh]:checked');if(r)d.beh=r.value;
  const f=document.querySelector('input[name=fwd]:checked');if(f)d.fwd=f.value;
  const mv=$('#f-move');if(mv)d.move=mv.checked;const ad=$('#f-mail');if(ad)d.addr=ad.value.trim();
  document.querySelectorAll('#main [data-via]').forEach(cb=>d.via[cb.dataset.via]=cb.checked)}
async function fromMail(){const it=curItem();
  if(!it){toast('Open eerst de mail met de aanmelding.');return}
  const pdfs=(it.attachments||[]).filter(a=>/\.pdf$/i.test(a.name||'')||a.contentType==='application/pdf');
  if(!pdfs.length){toast('Deze mail heeft geen pdf-bijlage. Bij Zivver: open de bijlage via Zivver en sleep hem in het vak.',5000);return}
  const a=pdfs[0];
  if(it.getAttachmentContentAsync){it.getAttachmentContentAsync(a.id,res=>{
    if(res.status!=='succeeded'||res.value.format!=='base64'){startDraft(a.name);return}
    const bin=atob(res.value.content),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);startDraft(a.name,buf)})}
  else startDraft(a.name)}
async function assign(){
  readDraft();const d=state.draft,naam=(d.naam||'').trim();
  if(!naam){toast('Vul de voornaam van de cliënt in.');return}
  if(!d.beh){toast('Kies eerst een behandelaar.');return}
  const it=curItem();
  if(!state.demo&&it&&d.fwd==='auto'&&!(mail[d.beh]&&mail[d.beh].addr)&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.addr||'')){toast('Vul het e-mailadres van '+d.beh+' in om automatisch door te sturen.');return}
  if(state.demo){
    const c={row:Date.now(),naam,beh:d.beh,datum:d.datum||today,intakeDatum:'',sessies:'',start:'',eind:'',jamesNr:'',via:{...d.via},dl:'',mailId:'',passief:false,pasDatum:'',done:{},doneDate:{}};
    if(d.fwd==='auto'&&it){c.done[S_NAAR]=true;c.doneDate[S_NAAR]=today}
    state.clients.unshift(c);state.draft=null;state.tab='caseload';state.filter=d.beh;render();
    toast(`Testmodus: ${naam} is toegewezen aan ${d.beh}. In het echt zou de mail nu ${d.fwd==='auto'?'worden doorgestuurd en ':''}${d.move?'naar "'+FOLDER+'" gaan':'blijven staan'}.`,6000);return}
  await run(async()=>{
    const log=[];
    // 1. mail: markeren, doorsturen, verplaatsen
    let restId='';
    if(it&&(d.move||d.fwd==='auto')){
      restId=MB().convertToRestId(it.itemId,Office.MailboxEnums.RestVersion.v2_0);
      if(d.fwd==='auto'){
        let addr=mail[d.beh]&&mail[d.beh].addr;
        if(!addr){addr=d.addr;const row=mail[d.beh].row;if(!setHdr[3])await setSetting('D1','E-mailadres');await setSetting('D'+row,addr);mail[d.beh].addr=addr}
        await g(`/me/messages/${restId}/forward`,{method:'POST',body:{comment:`Nieuwe aanmelding voor jou: ${naam}.`,toRecipients:[{emailAddress:{address:addr}}]}});log.push('doorgestuurd');}
      if(d.move){
        const m=await g(`/me/messages/${restId}?$select=categories`);
        const cat='Verwerkt – '+d.beh;
        await g(`/me/messages/${restId}`,{method:'PATCH',body:{categories:[...new Set([...(m.categories||[]).filter(x=>!/^Aanmelding/i.test(x)),cat])]}});
        const f=await g(`/me/mailFolders?$filter=${encodeURIComponent(`displayName eq '${FOLDER}'`)}`);
        const fid=f.value[0]?f.value[0].id:(await g('/me/mailFolders',{method:'POST',body:{displayName:FOLDER}})).id;
        const moved=await g(`/me/messages/${restId}/move`,{method:'POST',body:{destinationId:fid}});restId=moved.id;log.push('verplaatst');}
    }
    // 2. Excel-regel
    const vals={[COL.naam]:naam,[COL.beh]:d.beh,[COL.datum]:toSerial(d.datum||today),[COL.wg]:!!d.via.wg,[COL.ba]:!!d.via.ba,[COL.ov]:!!d.via.ov,[COL.pas]:false,[COL.pasd]:'',[COL.mail]:restId};
    STEPS.forEach(s=>{vals[s.k]=false;vals['Datum: '+s.k]=''});
    if(d.fwd==='auto'&&it){vals[S_NAAR]=true;vals['Datum: '+S_NAAR]=toSerial(today)}
    const row=state.emptyRows[0];
    if(row){const full=H.map(h=>h in vals?vals[h]:'');
      await g(wb(`/worksheets/${SHEET_CASE}/range(address='${colLetter(start.col)+row}:${colLetter(start.col+H.length-1)+row}')`),{method:'PATCH',body:{values:[full]}})}
    else{await g(wb(`/tables/${TABLE}/rows/add`),{method:'POST',body:{values:[H.map(h=>h in vals?vals[h]:'')]}})}
    state.draft=null;state.tab='caseload';state.filter=d.beh;
    await loadAll();
    toast(`${naam} is toegewezen aan ${d.beh}`+(log.length?' en de mail is '+log.join(' en ')+'.':'.')+(d.fwd==='zivver'?' Vergeet niet door te sturen via Zivver.':''),5000);
  });
}

function bind(){
  $('#doLink')?.addEventListener('click',()=>{const u=$('#shareUrl').value;if(!/^https:\/\//.test(u)){toast('Plak de volledige deellink (begint met https://).');return}
    run(async()=>{await linkFile(u);await refresh()})});
  $('#retry')?.addEventListener('click',()=>refresh());
  $('#unlink')?.addEventListener('click',()=>{file=null;store.set('file',null);state.err=null;render()});
  $('#reload')?.addEventListener('click',()=>refresh());
  $('#demo')?.addEventListener('click',()=>{state.demo=true;state.err=null;demoLoad();state.filter='Jasmijn';if(!T.includes(state.me))state.me='Susanne';state.tab='nieuw';render()});
  $('#leaveDemo')?.addEventListener('click',()=>{state.demo=false;state.draft=null;state.open=null;state.clients=[];T=[];if(file)refresh();else render()});
  $('#bigView')?.addEventListener('click',()=>openViewer(0));
  document.querySelectorAll('.doc .thumbs img').forEach(im=>im.onclick=()=>openViewer(+im.dataset.p));
  document.querySelectorAll('[data-f]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>{state.filter=b.dataset.f;render()}});
  $('#showDone')?.addEventListener('click',()=>{state.showDone=!state.showDone;render()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
  document.querySelectorAll('[data-cap]').forEach(i=>i.onchange=()=>{const t=i.dataset.cap,v=Math.max(0,+i.value||0);
    run(async()=>{await setSetting('B'+mail[t].row,v);cap[t]=v})});
  document.querySelectorAll('[data-done]').forEach(cb=>cb.onchange=()=>{const c=byRow(cb.dataset.done),k=cb.dataset.k;
    run(async()=>{await setCells(c.row,{[k]:true,['Datum: '+k]:toSerial(today),[COL.dl]:''});c.done[k]=true;c.doneDate[k]=today;c.dl='';
      const n=nextStep(c);toast(n?`Afgevinkt. Volgende stap voor ${c.naam}: ${n.l} (${owner(c,n)})`:`${c.naam} is afgerond.`)})});
  document.querySelectorAll('[data-tintake]').forEach(i=>i.onchange=()=>{if(!i.value)return;const c=byRow(i.dataset.tintake),v=i.value;
    run(async()=>{await setCells(c.row,{[COL.intake]:toSerial(v),[S_INTAKE]:true,['Datum: '+S_INTAKE]:toSerial(today),[COL.dl]:''});c.intakeDatum=v;c.done[S_INTAKE]=true;c.doneDate[S_INTAKE]=today;c.dl='';
      const n=nextStep(c);toast(`Intake ${c.naam} ingepland op ${fmt(v)}.`+(n?` Volgende: ${n.l}, uiterlijk ${fmt(deadline(c,n))}.`:''))})});
  document.querySelectorAll('#main [data-via]').forEach(cb=>cb.onchange=()=>{readDraft();render()});
  document.querySelectorAll('input[name=beh],input[name=fwd]').forEach(r=>r.onchange=()=>{readDraft();render()});
  const drop=$('#drop');
  if(drop){const fi=$('#file');
    drop.onclick=()=>fi.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click()}};
    const take=f=>{if(!f)return;f.arrayBuffer().then(b=>startDraft(f.name,new Uint8Array(b)))};
    fi.onchange=()=>take(fi.files[0]);
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
    drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)take(f);else toast('Dit kon niet als bestand worden gelezen. Sla de pdf eerst op en kies hem via klikken.',5000)});
    $('#fromMail').onclick=fromMail;$('#manual').onclick=()=>startDraft('',null);}
  $('#cancel')?.addEventListener('click',()=>{state.draft=null;document.querySelector('.viewer')?.remove();render()});
  $('#assign')?.addEventListener('click',assign);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.open=null;render()});
$('#me').onchange=e=>{state.me=e.target.value;store.set('me',state.me);render()};

async function boot(){
  file=store.get('file');
  let me=store.get('me');
  if(!me){try{me=(Office.context.mailbox.userProfile.displayName||'').split(' ')[0]}catch(e){}}
  state.me=me||'';
  state.tab=/susanne/i.test(state.me)?'nieuw':'todo';
  if(!file){state.loading=false;render();return}
  await refresh();
  if(!T.includes(state.me))state.me=T[0]||'';render();
}
if(window.Office&&Office.onReady)Office.onReady(()=>boot());else boot();
